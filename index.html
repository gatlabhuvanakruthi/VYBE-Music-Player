<!DOCTYPE html>

<html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VYBE — Music Player</title>

<style> *{ margin:0; padding:0; box-sizing:border-box; } body{ font-family:Arial, Helvetica, sans-serif; background:#08080d; color:white; overflow-x:hidden; } /* ================= SIDEBAR ================= */ .sidebar{ position:fixed; left:0; top:0; bottom:0; width:240px; background:#0d0d14; border-right:1px solid #242431; padding:25px 18px; z-index:10; } .logo{ font-size:28px; font-weight:900; margin-bottom:35px; padding-left:10px; } .logo span{ color:#a66cff; } .menu-title{ color:#666675; font-size:11px; letter-spacing:2px; margin:25px 10px 8px; } .nav-btn{ width:100%; background:none; border:none; color:#9292a3; text-align:left; padding:13px; border-radius:10px; cursor:pointer; margin:3px 0; font-size:15px; } .nav-btn:hover, .nav-btn.active{ background:#1d1a29; color:white; } /* ================= MAIN ================= */ .main{ margin-left:240px; padding:30px; padding-bottom:150px; } /* ================= TOP BAR ================= */ .topbar{ display:flex; justify-content:space-between; align-items:center; gap:20px; } .greeting{ color:#9999a8; } .search{ width:320px; padding:13px 18px; border-radius:30px; border:1px solid #292936; background:#15151e; color:white; outline:none; } .search:focus{ border-color:#a66cff; } /* ================= HERO ================= */ .hero{ margin-top:35px; padding:45px; min-height:330px; border-radius:25px; background: radial-gradient(circle at 80% 40%,#6634a5 0%,transparent 30%), linear-gradient(120deg,#21172f,#15131f); border:1px solid #332944; display:flex; justify-content:space-between; align-items:center; overflow:hidden; } .hero-small{ color:#b38aff; font-size:13px; font-weight:bold; letter-spacing:2px; } .hero h1{ font-size:64px; line-height:.95; margin:15px 0; letter-spacing:-4px; } .hero p{ max-width:550px; color:#aaa7b7; line-height:1.6; } .start-btn{ margin-top:25px; padding:13px 22px; background:white; color:#111; border:none; border-radius:10px; cursor:pointer; font-weight:bold; } .start-btn:hover{ transform:scale(1.03); } /* ================= HERO ART ================= */ .hero-art{ width:210px; height:210px; border-radius:50%; background: conic-gradient( #ff78c8, #9b70ff, #4edbff, #ff78c8 ); box-shadow:0 0 80px #9d70ff77; display:flex; justify-content:center; align-items:center; flex-shrink:0; } .hero-art::after{ content:"♫"; width:130px; height:130px; border-radius:50%; background:#171322; display:flex; justify-content:center; align-items:center; font-size:65px; } /* ================= SECTION ================= */ .section-header{ display:flex; justify-content:space-between; align-items:center; margin:35px 0 15px; } .section-header h2{ font-size:21px; } .song-count{ color:#777788; font-size:13px; } /* ================= SONG CARDS ================= */ .cards{ display:grid; grid-template-columns: repeat(auto-fill,minmax(180px,1fr)); gap:18px; } .card{ background:#111119; border:1px solid #252530; padding:14px; border-radius:16px; transition:.2s; } .card:hover{ transform:translateY(-4px); background:#171720; } .cover{ width:100%; aspect-ratio:1; border-radius:12px; background: linear-gradient( 135deg, #6535a0, #df6cae ); display:flex; justify-content:center; align-items:center; font-size:50px; margin-bottom:13px; } .card:nth-child(2n) .cover{ background:linear-gradient( 135deg, #294a89, #7655e8 ); } .card:nth-child(3n) .cover{ background:linear-gradient( 135deg, #744c2b, #db835b ); } .card-title{ font-size:15px; font-weight:bold; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .card-artist{ color:#858594; font-size:12px; margin-top:5px; } .card-buttons{ display:flex; justify-content:space-between; align-items:center; margin-top:12px; } .play-small{ width:35px; height:35px; border-radius:50%; border:none; background:white; color:#111; cursor:pointer; } .favorite{ border:none; background:none; font-size:20px; color:#777788; cursor:pointer; } .favorite.active{ color:#ff68bb; } /* ================= TRACK LIST ================= */ .track-list{ background:#111119; border:1px solid #252530; border-radius:17px; overflow:hidden; } .track{ display:grid; grid-template-columns:45px 1fr 100px 100px; align-items:center; gap:10px; padding:14px 17px; border-bottom:1px solid #23232d; } .track:last-child{ border-bottom:none; } .track:hover{ background:#181820; } .track-number{ color:#777788; } .track-name{ font-weight:bold; } .track-artist{ color:#858594; font-size:12px; margin-top:4px; } .track-actions{ display:flex; gap:10px; } .track-actions button{ background:none; border:none; color:#aaa; cursor:pointer; font-size:17px; } .track-actions button:hover{ color:white; } /* ================= PLAYER ================= */ .player{ position:fixed; left:240px; right:0; bottom:0; height:105px; background:rgba(14,14,20,.96); backdrop-filter:blur(20px); border-top:1px solid #292936; display:grid; grid-template-columns:1.3fr 1fr 1.3fr; align-items:center; padding:15px 25px; z-index:100; } .now-playing{ display:flex; align-items:center; gap:13px; } .now-cover{ width:55px; height:55px; border-radius:10px; background:linear-gradient( 135deg, #7049ca, #ec73b9 ); display:flex; justify-content:center; align-items:center; font-size:25px; } .now-title{ font-weight:bold; } .now-artist{ color:#858594; font-size:12px; margin-top:4px; } /* ================= CONTROLS ================= */ .controls{ text-align:center; } .control-buttons button{ background:none; border:none; color:white; font-size:20px; margin:0 6px; cursor:pointer; } .play-main{ width:44px; height:44px; border-radius:50%; background:white !important; color:#111 !important; } .progress-area{ display:flex; align-items:center; gap:8px; margin-top:5px; } .progress{ width:100%; accent-color:#a66cff; cursor:pointer; } .time{ color:#777788; font-size:11px; } /* ================= VOLUME ================= */ .volume{ display:flex; justify-content:flex-end; align-items:center; gap:10px; } .volume input{ width:110px; accent-color:#a66cff; } /* ================= TOAST ================= */ .toast{ position:fixed; top:20px; right:20px; background:white; color:#111; padding:12px 17px; border-radius:10px; transform:translateY(-100px); transition:.3s; z-index:500; } .toast.show{ transform:translateY(0); } /* ================= MOBILE ================= */ @media(max-width:800px){ .sidebar{ display:none; } .main{ margin-left:0; padding:18px; padding-bottom:150px; } .player{ left:0; height:120px; grid-template-columns:1fr; } .now-playing, .volume{ display:none; } .hero{ padding:28px; } .hero h1{ font-size:45px; } .hero-art{ width:100px; height:100px; } .hero-art::after{ width:65px; height:65px; font-size:30px; } .search{ width:50%; } .track{ grid-template-columns:30px 1fr 80px; } .track-duration{ display:none; } } </style>

</head>

<body>

<!-- ================= SIDEBAR ================= -->

<aside class="sidebar">

<div class="logo">
    VYBE<span>•</span>
</div>

<button class="nav-btn active"
    onclick="changePage('home',this)">
    🏠 &nbsp; Home
</button>

<button class="nav-btn"
    onclick="changePage('favorites',this)">
    ♥ &nbsp; Favorites
</button>

<button class="nav-btn"
    onclick="changePage('library',this)">
    🎵 &nbsp; Your Library
</button>

<div class="menu-title">
    YOUR MUSIC
</div>

<button class="nav-btn"
    onclick="changePage('all',this)">
    ♪ &nbsp; All Songs
</button>

<button class="nav-btn"
    onclick="downloadCurrent()">
    ↓ &nbsp; Download Current
</button>

</aside>

<!-- ================= MAIN ================= -->

<main class="main">

<div class="topbar">

    <div class="greeting">
        Good evening ✦
    </div>

    <input
        id="search"
        class="search"
        placeholder="Search songs or artists..."
        oninput="renderSongs()"
    >

</div>


<!-- ================= HERO ================= -->

<section class="hero">

    <div>

        <div class="hero-small">
            YOUR MUSIC • DEMO
        </div>

        <h1>
            Feel the<br>
            moment.
        </h1>

        <p>
            Your personal music player with
            favorites, downloads, search,
            playlists and smooth playback.
        </p>

        <button
            class="start-btn"
            onclick="playSong(0)">
            ▶ Start Listening
        </button>

    </div>

    <div class="hero-art"></div>

</section>


<!-- ================= CARDS ================= -->

<div class="section-header">

    <h2 id="pageTitle">
        Made For You
    </h2>

    <span
        id="songCount"
        class="song-count">
    </span>

</div>

<div
    id="cards"
    class="cards">
</div>


<!-- ================= TRACK LIST ================= -->

<div class="section-header">

    <h2>
        All Tracks
    </h2>

    <span class="song-count">
        Click a song to play
    </span>

</div>

<div
    id="trackList"
    class="track-list">
</div>

</main>

<!-- ================= PLAYER ================= -->

<div class="player">

<div class="now-playing">

    <div class="now-cover">
        ♫
    </div>

    <div>

        <div
            id="nowTitle"
            class="now-title">
            Nothing Playing
        </div>

        <div
            id="nowArtist"
            class="now-artist">
            Select a song
        </div>

    </div>

</div>


<div class="controls">

    <div class="control-buttons">

        <button onclick="previousSong()">
            ⏮
        </button>

        <button
            id="playButton"
            class="play-main"
            onclick="togglePlay()">
            ▶
        </button>

        <button onclick="nextSong()">
            ⏭
        </button>

    </div>


    <div class="progress-area">

        <span
            id="currentTime"
            class="time">
            0:00
        </span>

        <input
            id="progress"
            class="progress"
            type="range"
            min="0"
            max="100"
            value="0"
            oninput="seekSong(this.value)"
        >

        <span
            id="duration"
            class="time">
            0:00
        </span>

    </div>

</div>


<div class="volume">

    🔊

    <input
        id="volume"
        type="range"
        min="0"
        max="1"
        step="0.01"
        value="0.8"
        oninput="audio.volume=this.value"
    >

</div>

</div>

<div id="toast" class="toast"></div>

<!-- ================= AUDIO ================= -->

<audio id="audio"></audio>

<script> /* ===================================================== YOUR SONGS ===================================================== */ const songs = [ { title:"Dynamite", artist:"BTS", file:"music/Dynamite.mp4" }, { title:"mad woman", artist:"Taylor Swift", file:"music/Mad Woman.mp4" }, { title:"Summertime Sadness", artist:"Lana Del Rey", file:"music/Summertime Sadness.mp4" }, { title:"cardigan", artist:"Taylor Swift", file:"music/Cardigan.mp4" }, { title:"Blank Space", artist:"Taylor Swift", file:"music/Blank Space.mp4" }, { title:"I Can Do It With a Broken Heart", artist:"Taylor Swift", file:"music/I Can Do It With a Broken Heart.mp4" }, { title:"Cruel Summer", artist:"Taylor Swift", file:"music/Cruel Summer.mp4" }, { title:"22", artist:"Taylor Swift", file:"music/22.mp4" }, { title:"Snooze", artist:"SZA", file:"music/Snooze.mp4" }, { title:"Mantra", artist:"JENNIE", file:"music/Mantra.mp4" }, { title:"Young And Beautiful", artist:"Lana Del Rey", file:"music/Young And Beautiful.mp4" }, { title:"Kannullo Nee Roopame", artist:"Various Artist", file:"music/Kannullo Nee Roopame.mp4" } ]; /* ===================================================== PLAYER VARIABLES ===================================================== */ const audio = document.getElementById("audio"); let currentSong = -1; let favorites = JSON.parse( localStorage.getItem("vybeFavorites") || "[]" ); let currentPage = "home"; /* ===================================================== FORMAT TIME ===================================================== */ function formatTime(seconds){ if(!isFinite(seconds)) return "0:00"; let minutes = Math.floor(seconds / 60); let secs = Math.floor(seconds % 60); return minutes + ":" + String(secs).padStart(2,"0"); } /* ===================================================== PLAY SONG ===================================================== */ function playSong(index){ if(!songs[index]) return; currentSong = index; audio.src = songs[index].file; audio.play().catch(function(error){ console.log("Playback error:",error); showToast( "Song could not be played" ); }); updatePlayer(); showToast( "Playing " + songs[index].title ); } /* ===================================================== PLAY / PAUSE ===================================================== */ function togglePlay(){ if(currentSong === -1){ playSong(0); return; } if(audio.paused){ audio.play(); }else{ audio.pause(); } updatePlayer(); } /* ===================================================== PREVIOUS ===================================================== */ function previousSong(){ if(currentSong === -1){ playSong(0); return; } let index = currentSong - 1; if(index < 0) index = songs.length - 1; playSong(index); } /* ===================================================== NEXT ===================================================== */ function nextSong(){ if(currentSong === -1){ playSong(0); return; } let index = currentSong + 1; if(index >= songs.length) index = 0; playSong(index); } /* ===================================================== UPDATE PLAYER ===================================================== */ function updatePlayer(){ if(currentSong === -1) return; document.getElementById( "nowTitle" ).textContent = songs[currentSong].title; document.getElementById( "nowArtist" ).textContent = songs[currentSong].artist; document.getElementById( "playButton" ).textContent = audio.paused ? "▶" : "Ⅱ"; } /* ===================================================== AUDIO EVENTS ===================================================== */ audio.addEventListener( "play", updatePlayer ); audio.addEventListener( "pause", updatePlayer ); audio.addEventListener( "timeupdate", function(){ document.getElementById( "currentTime" ).textContent = formatTime(audio.currentTime); let progress = 0; if(audio.duration){ progress = (audio.currentTime / audio.duration) * 100; } document.getElementById( "progress" ).value = progress; } ); audio.addEventListener( "loadedmetadata", function(){ document.getElementById( "duration" ).textContent = formatTime(audio.duration); } ); audio.addEventListener( "ended", function(){ nextSong(); } ); audio.addEventListener( "error", function(){ showToast( "Could not load this song" ); console.log( "Audio error:", songs[currentSong]?.file ); } ); /* ===================================================== SEEK ===================================================== */ function seekSong(value){ if(!audio.duration) return; audio.currentTime = (value / 100) * audio.duration; } /* ===================================================== FAVORITES ===================================================== */ function toggleFavorite(index){ if( favorites.includes(index) ){ favorites = favorites.filter( x => x !== index ); showToast( "Removed from favorites" ); }else{ favorites.push(index); showToast( "Added to favorites ❤️" ); } localStorage.setItem( "vybeFavorites", JSON.stringify(favorites) ); renderSongs(); } /* ===================================================== DOWNLOAD ===================================================== */ function downloadSong(index){ if(!songs[index]) return; let link = document.createElement("a"); link.href = songs[index].file; link.download = songs[index].file .split("/") .pop(); document.body.appendChild(link); link.click(); document.body.removeChild(link); showToast( "Download started ↓" ); } function downloadCurrent(){ if(currentSong === -1){ showToast( "Play a song first" ); return; } downloadSong(currentSong); } /* ===================================================== GET SONGS ===================================================== */ function getSongs(){ let search = document.getElementById("search") .value .toLowerCase() .trim(); let result = songs.filter(song => { return ( song.title + " " + song.artist ) .toLowerCase() .includes(search); }); if( currentPage === "favorites" || currentPage === "library" ){ result = result.filter(song => favorites.includes( songs.indexOf(song) ) ); } return result; } /* ===================================================== RENDER SONGS ===================================================== */ function renderSongs(){ let result = getSongs(); let cards = document.getElementById("cards"); let trackList = document.getElementById("trackList"); cards.innerHTML = ""; trackList.innerHTML = ""; document.getElementById( "songCount" ).textContent = result.length + " songs"; if(result.length === 0){ cards.innerHTML = ` <div style=" color:#888; padding:30px; grid-column:1/-1; "> No songs found 🎵 </div> `; trackList.innerHTML = ` <div style=" padding:25px; color:#888; "> No songs found. </div> `; return; } /* SONG CARDS */ result.forEach(song => { let index = songs.indexOf(song); let isFavorite = favorites.includes(index); let card = document.createElement("div"); card.className = "card"; card.innerHTML = ` <div class="cover"> ♫ </div> <div class="card-title"> ${song.title} </div> <div class="card-artist"> ${song.artist} </div> <div class="card-buttons"> <button class="play-small" onclick="playSong(${index})"> ▶ </button> <button class="favorite ${isFavorite ? "active" : ""}" onclick="toggleFavorite(${index})"> ${isFavorite ? "♥" : "♡"} </button> </div> `; cards.appendChild(card); }); /* TRACK LIST */ result.forEach((song,position) => { let index = songs.indexOf(song); let isFavorite = favorites.includes(index); let track = document.createElement("div"); track.className = "track"; track.innerHTML = ` <div class="track-number"> ${position + 1} </div> <div> <div class="track-name"> ${song.title} </div> <div class="track-artist"> ${song.artist} </div> </div> <div class="track-duration"> — </div> <div class="track-actions"> <button onclick="playSong(${index})"> ▶ </button> <button onclick="toggleFavorite(${index})"> ${isFavorite ? "♥" : "♡"} </button> <button onclick="downloadSong(${index})"> ↓ </button> </div> `; trackList.appendChild(track); }); } /* ===================================================== CHANGE PAGE ===================================================== */ function changePage(page,button){ currentPage = page; document.querySelectorAll( ".nav-btn" ).forEach(btn => { btn.classList.remove( "active" ); }); if(button){ button.classList.add( "active" ); } let title = document.getElementById( "pageTitle" ); if(page === "home"){ title.textContent = "Made For You"; } else if(page === "favorites"){ title.textContent = "Your Favorites"; } else if(page === "library"){ title.textContent = "Your Library"; } else if(page === "all"){ title.textContent = "All Songs"; } renderSongs(); } /* ===================================================== TOAST ===================================================== */ function showToast(message){ let toast = document.getElementById( "toast" ); toast.textContent = message; toast.classList.add( "show" ); setTimeout( function(){ toast.classList.remove( "show" ); }, 2000 ); } /* ===================================================== START APP ===================================================== */ renderSongs(); </script>

</body> </html> ```
